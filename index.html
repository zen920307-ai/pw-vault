<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PW Vault</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3345;--text:#e8eaed;--text2:#9aa0b0;--accent:#6c5ce7;--accent2:#a29bfe;--danger:#e74c3c;--success:#2ecc71;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

.view{display:none;min-height:100vh}.view.active{display:flex;flex-direction:column}

.lock-screen{align-items:center;justify-content:center;gap:24px;padding:40px 20px}
.lock-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.lock-title{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--text)}
.lock-sub{font-size:14px;color:var(--text2);margin-top:-8px}
.pin-row{display:flex;gap:16px;margin:32px 0 24px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent2);transform:scale(1.2)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:260px}
.pin-key{height:56px;border-radius:var(--radius);background:var(--surface2);border:none;color:var(--text);font-size:22px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:var(--accent);transform:scale(.92)}
.pin-key.fn{font-size:14px;color:var(--text2)}
.pin-error{font-size:13px;color:var(--danger);opacity:0;transition:opacity .3s;margin-top:-16px}
.pin-error.show{opacity:1}

.main-view{padding:0 16px 80px}
.main-header{display:flex;align-items:center;padding:16px 0;gap:12px}
.main-header h1{font-size:20px;font-weight:700;flex:1}
.header-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.header-btn:active{background:var(--accent);color:#fff}

.search-box{display:flex;background:var(--surface2);border-radius:var(--radius);padding:0 12px;margin:12px 0;align-items:center;gap:8px}
.search-box input{flex:1;border:none;background:none;color:var(--text);font-size:14px;padding:10px 0;outline:none}
.search-box input::placeholder{color:var(--text2)}
.search-icon{color:var(--text2);font-size:16px}

.group-tabs{display:flex;gap:8px;margin:8px 0 16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.group-tabs::-webkit-scrollbar{display:none}
.group-tab{padding:6px 16px;border-radius:20px;background:var(--surface2);color:var(--text2);font-size:13px;border:none;cursor:pointer;white-space:nowrap;transition:all .2s}
.group-tab.active{background:var(--accent);color:#fff}

.section-title{font-size:13px;color:var(--text2);padding:8px 0 4px;font-weight:600;letter-spacing:1px}

.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.item-card:active{transform:scale(.98);background:var(--surface2)}
.item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-account{font-size:12px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-arrow{color:var(--text2);font-size:14px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state p{font-size:14px;line-height:1.6}

.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(108,92,231,.4);transition:transform .2s;z-index:10}
.fab:active{transform:scale(.9)}

.form-view{padding:0 16px}
.form-header{display:flex;align-items:center;padding:16px 0;gap:12px}
.form-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-header h2{font-size:18px;font-weight:700;flex:1}
.form-header .save{padding:8px 20px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer}

.form-group{margin-bottom:16px}
.form-group label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500}
.form-group input,.form-group select{width:100%;padding:12px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group select{appearance:none;-webkit-appearance:none}

.pw-row{display:flex;gap:8px}
.pw-row input{flex:1}
.pw-toggle{width:44px;height:44px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pw-toggle:active{background:var(--accent);color:#fff}
.pw-copy{width:44px;height:44px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.detail-view{padding:0 16px}
.detail-header{display:flex;align-items:center;padding:16px 0;gap:12px}
.detail-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.detail-header h2{font-size:18px;font-weight:700;flex:1}
.detail-actions{display:flex;gap:8px}
.detail-actions button{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.btn-edit{background:var(--surface2);color:var(--accent2)}
.btn-delete{background:var(--surface2);color:var(--danger)}

.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px}
.detail-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:12px;color:var(--text2);width:50px;flex-shrink:0}
.detail-value{flex:1;font-size:14px;word-break:break-all;user-select:all}
.detail-copy{width:36px;height:36px;border-radius:8px;background:var(--surface2);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px;transition:all .15s}
.detail-copy:active{background:var(--accent);color:#fff}
.detail-copy.copied{background:var(--success);color:#fff}

.group-view{padding:0 16px}
.group-header{display:flex;align-items:center;padding:16px 0;gap:12px}
.group-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.group-header h2{font-size:18px;font-weight:700;flex:1}
.group-header .add-btn{padding:8px 16px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

.group-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px}
.group-name{flex:1;font-size:15px}
.group-count{font-size:12px;color:var(--text2);padding:4px 10px;border-radius:12px;background:var(--surface2)}
.group-edit{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:none;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.sync-view{padding:0 16px}
.sync-header{display:flex;align-items:center;padding:16px 0;gap:12px}
.sync-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sync-header h2{font-size:18px;font-weight:700;flex:1}

.sync-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.sync-section h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--accent2)}
.sync-status{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--surface2);font-size:13px;margin-bottom:12px}
.sync-status.ok{color:var(--success)}
.sync-status.err{color:var(--danger)}
.sync-status.idle{color:var(--text2)}

.sync-btns{display:flex;gap:12px;margin-top:12px}
.sync-btn{padding:12px 0;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.sync-btn:active{transform:scale(.95)}
.sync-btn.upload{background:var(--accent);color:#fff}
.sync-btn.download{background:var(--success);color:#fff}

.form-hint{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.4}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);padding:10px 24px;border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:13px;z-index:999;opacity:0;transition:all .3s;border:1px solid var(--border);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-color:var(--success);background:rgba(46,204,113,.15);color:var(--success)}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:320px}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal-box p{font-size:13px;color:var(--text2);margin-bottom:20px}
.modal-btns{display:flex;gap:12px;justify-content:flex-end}
.modal-btns button{padding:10px 20px;border-radius:10px;border:none;font-size:14px;cursor:pointer;font-weight:600}
.modal-cancel{background:var(--surface2);color:var(--text2)}
.modal-confirm{background:var(--danger);color:#fff}

.lock-btn{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.sync-indicator{position:fixed;top:16px;right:60px;width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.sync-indicator.synced{color:var(--success)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">确认删除</h3>
    <p id="modalMsg">删除后无法恢复，确定要删除吗？</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" id="modalConfirm">删除</button>
    </div>
  </div>
</div>

<div class="view lock-screen active" id="lockView">
  <div class="lock-logo">🔐</div>
  <div class="lock-title">PW Vault</div>
  <div class="lock-sub">输入4位数字密码解锁</div>
  <div class="pin-row" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-error" id="pinError">密码错误，请重新输入</div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinInput(1)">1</button>
    <button class="pin-key" onclick="pinInput(2)">2</button>
    <button class="pin-key" onclick="pinInput(3)">3</button>
    <button class="pin-key" onclick="pinInput(4)">4</button>
    <button class="pin-key" onclick="pinInput(5)">5</button>
    <button class="pin-key" onclick="pinInput(6)">6</button>
    <button class="pin-key" onclick="pinInput(7)">7</button>
    <button class="pin-key" onclick="pinInput(8)">8</button>
    <button class="pin-key" onclick="pinInput(9)">9</button>
    <button class="pin-key fn" onclick="pinClear()">清除</button>
    <button class="pin-key" onclick="pinInput(0)">0</button>
    <button class="pin-key fn" onclick="pinDelete()">⌫</button>
  </div>
</div>

<div class="view main-view" id="mainView">
  <div class="main-header">
    <h1>PW Vault</h1>
    <button class="sync-indicator" id="syncInd" onclick="showView('syncView')" title="云同步">☁️</button>
    <button class="header-btn" onclick="showView('groupView')" title="分组管理">📁</button>
    <button class="lock-btn" onclick="lockApp()" title="锁定">🔒</button>
  </div>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索名称或账户..." oninput="renderList()">
  </div>
  <div class="group-tabs" id="groupTabs"></div>
  <div id="itemList"></div>
  <button class="fab" onclick="openForm()">＋</button>
</div>

<div class="view form-view" id="formView">
  <div class="form-header">
    <button class="back" onclick="showView('mainView')">←</button>
    <h2 id="formTitle">新增密码</h2>
    <button class="save" onclick="saveItem()">保存</button>
  </div>
  <div class="form-group">
    <label>名称 *</label>
    <input type="text" id="fName" placeholder="如：微信、支付宝">
  </div>
  <div class="form-group">
    <label>网址（选填）</label>
    <input type="url" id="fUrl" placeholder="https://...">
  </div>
  <div class="form-group">
    <label>账户 *</label>
    <div class="pw-row">
      <input type="text" id="fAccount" placeholder="邮箱/手机/用户名">
      <button class="pw-copy" onclick="copyField('fAccount')">📋</button>
    </div>
  </div>
  <div class="form-group">
    <label>密码 *</label>
    <div class="pw-row">
      <input type="password" id="fPassword" placeholder="密码">
      <button class="pw-toggle" onclick="togglePw()" id="pwEye">👁</button>
      <button class="pw-copy" onclick="copyField('fPassword')">📋</button>
    </div>
  </div>
  <div class="form-group">
    <label>分组</label>
    <select id="fGroup"><option value="">未分组</option></select>
  </div>
</div>

<div class="view detail-view" id="detailView">
  <div class="detail-header">
    <button class="back" onclick="showView('mainView')">←</button>
    <h2>密码详情</h2>
    <div class="detail-actions">
      <button class="btn-edit" onclick="editCurrentItem()">✏️</button>
      <button class="btn-delete" onclick="deleteCurrentItem()">🗑</button>
    </div>
  </div>
  <div class="detail-card" id="detailCard"></div>
</div>

<div class="view group-view" id="groupView">
  <div class="group-header">
    <button class="back" onclick="showView('mainView')">←</button>
    <h2>分组管理</h2>
    <button class="add-btn" onclick="addGroup()">＋ 新分组</button>
  </div>
  <div id="groupList"></div>
</div>

<div class="view sync-view" id="syncView">
  <div class="sync-header">
    <button class="back" onclick="showView('mainView')">←</button>
    <h2>云同步</h2>
  </div>
  <div class="sync-section">
    <h3>GitHub Token 设置</h3>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input type="password" id="syncToken" placeholder="ghp_xxxx...">
      <div class="form-hint">需要 gist 读写权限。Token 只保存在你浏览器本地，不会外泄。</div>
    </div>
    <button class="sync-btn upload" style="width:100%;flex:none" onclick="saveSyncConfig()">保存配置</button>
  </div>
  <div class="sync-section">
    <h3>数据同步</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:14px">自动同步</span>
      <label style="position:relative;width:48px;height:26px;display:inline-block;cursor:pointer">
        <input type="checkbox" id="autoSyncSwitch" onchange="toggleAutoSync()" style="opacity:0;width:0;height:0">
        <span style="position:absolute;top:0;left:0;right:0;bottom:0;background:var(--surface2);border-radius:13px;transition:.3s"></span>
        <span id="autoSyncDot" style="position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--text2);border-radius:10px;transition:.3s"></span>
      </label>
    </div>
    <div class="sync-status idle" id="syncStatus">未配置同步</div>
    <div class="sync-btns">
      <button class="sync-btn upload" onclick="syncUpload()">⬆ 上传</button>
      <button class="sync-btn download" onclick="syncDownload()">⬇ 下载</button>
    </div>
    <div class="form-hint" style="margin-top:12px">自动同步：数据变更后3秒自动上传云端，解锁时自动下载最新数据<br>手动上传/下载：随时手动触发一次完整同步</div>
  </div>
</div>

<script>
const MASTER_PIN = '4143';
const GIST_DESC = 'PW Vault Sync Data';
const GIST_FILENAME = 'pwvault_encrypted.json';
let pin = '';
let unlocked = false;
let currentGroup = '';
let editingId = null;
let currentDetailId = null;
let modalCallback = null;
let currentDetailItem = null;

function getData() {
  try { return JSON.parse(localStorage.getItem('pwvault_data') || '{"items":[],"groups":[]}'); }
  catch(e) { return {items:[],groups:[]}; }
}
function setData(d) { localStorage.setItem('pwvault_data', JSON.stringify(d)); autoSyncUpload(); }

function getSyncConfig() {
  return { token: localStorage.getItem('pwvault_sync_token') || '', gistId: localStorage.getItem('pwvault_sync_gist') || '', autoSync: localStorage.getItem('pwvault_sync_auto') === 'true' };
}
function setSyncConfig(token, gistId) {
  localStorage.setItem('pwvault_sync_token', token);
  localStorage.setItem('pwvault_sync_gist', gistId);
}
function isAutoSyncEnabled() {
  const cfg = getSyncConfig();
  return cfg.autoSync && cfg.token;
}
let syncUploadTimer = null;
function autoSyncUpload() {
  if(!isAutoSyncEnabled()) return;
  if(syncUploadTimer) clearTimeout(syncUploadTimer);
  syncUploadTimer = setTimeout(() => { doSyncUpload(true); }, 3000);
}

function aesEncrypt(text, key) {
  const k = CryptoJS.SHA256(key).toString();
  return CryptoJS.AES.encrypt(text, k).toString();
}
function aesDecrypt(ciphertext, key) {
  const k = CryptoJS.SHA256(key).toString();
  const bytes = CryptoJS.AES.decrypt(ciphertext, k);
  return bytes.toString(CryptoJS.enc.Utf8);
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'success' ? ' success' : '');
  setTimeout(() => { t.className = 'toast'; }, 2000);
}
function openModal(title, msg, cb) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modal').classList.add('show');
  modalCallback = cb;
  document.getElementById('modalConfirm').onclick = () => { closeModal(); if(modalCallback) modalCallback(); };
}
function closeModal() { document.getElementById('modal').classList.remove('show'); modalCallback = null; }

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'mainView') { renderList(); updateSyncIndicator(); }
  if(id === 'groupView') renderGroups();
  if(id === 'formView') updateGroupSelect();
  if(id === 'syncView') renderSyncView();
}

function pinInput(n) {
  if(pin.length >= 4) return;
  pin += n;
  updatePinDots();
  if(pin.length === 4) {
    setTimeout(() => {
      if(pin === MASTER_PIN) {
        unlocked = true; pin = ''; updatePinDots();
        const localData = getData();
        const cfg = getSyncConfig();
        if(!localData.items.length && !cfg.gistId && !cfg.token) {
          showView('syncView');
          showToast('首次使用请配置云同步以恢复数据');
        } else {
          doSyncDownload(true);
          showView('mainView');
        }
      }
      else { document.getElementById('pinError').classList.add('show'); pin = ''; updatePinDots(); setTimeout(() => document.getElementById('pinError').classList.remove('show'), 1500); }
    }, 150);
  }
}
function pinDelete() { pin = pin.slice(0,-1); updatePinDots(); }
function pinClear() { pin = ''; updatePinDots(); }
function updatePinDots() {
  const dots = document.getElementById('pinDots').children;
  for(let i=0;i<4;i++) dots[i].classList.toggle('filled', i < pin.length);
}
function lockApp() { unlocked = false; pin = ''; updatePinDots(); showView('lockView'); }

const COLORS = ['#6c5ce7','#e74c3c','#2ecc71','#f39c12','#00cec9','#fd79a8','#0984e3','#d63031','#55efc4','#ffeaa7'];
function getIconColor(name) {
  let h = 0;
  for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}
function getInitial(name) { return name.charAt(0).toUpperCase(); }

function renderList() {
  const d = getData();
  const q = document.getElementById('searchInput').value.toLowerCase();
  let items = d.items;
  if(q) items = items.filter(i => i.name.toLowerCase().includes(q) || i.account.toLowerCase().includes(q));
  if(currentGroup) items = items.filter(i => i.group === currentGroup);

  const tabsHtml = ['全部', ...d.groups].map(g =>
    `<button class="group-tab ${g === (currentGroup || '全部') ? 'active' : ''}" onclick="setGroup('${g === '全部' ? '' : g}')">${g}</button>`
  ).join('');
  document.getElementById('groupTabs').innerHTML = tabsHtml;

  if(!items.length) {
    document.getElementById('itemList').innerHTML = `<div class="empty-state"><div class="icon">🔒</div><p>${q ? '没有找到匹配的密码' : '还没有保存任何密码<br>点击右下角 ＋ 开始添加'}</p></div>`;
    return;
  }

  const grouped = {};
  items.forEach(i => { const g = i.group || '未分组'; if(!grouped[g]) grouped[g] = []; grouped[g].push(i); });

  let html = '';
  const order = d.groups.filter(g => grouped[g]).concat(Object.keys(grouped).filter(g => !d.groups.includes(g)));
  order.forEach(g => {
    html += `<div class="section-title">${g}</div>`;
    grouped[g].forEach(i => {
      html += `<div class="item-card" onclick="viewItem('${i.id}')">
        <div class="item-icon" style="background:${getIconColor(i.name)}">${getInitial(i.name)}</div>
        <div class="item-info"><div class="item-name">${esc(i.name)}</div><div class="item-account">${esc(i.account)}</div></div>
        <span class="item-arrow">›</span>
      </div>`;
    });
  });
  document.getElementById('itemList').innerHTML = html;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setGroup(g) { currentGroup = g; renderList(); }

function openForm(id) {
  editingId = id || null;
  document.getElementById('formTitle').textContent = id ? '编辑密码' : '新增密码';
  if(id) {
    const item = getData().items.find(i => i.id === id);
    if(!item) return;
    document.getElementById('fName').value = item.name;
    document.getElementById('fUrl').value = item.url || '';
    document.getElementById('fAccount').value = item.account;
    document.getElementById('fPassword').value = item.password;
    document.getElementById('fGroup').value = item.group || '';
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fAccount').value = '';
    document.getElementById('fPassword').value = '';
    document.getElementById('fGroup').value = currentGroup || '';
  }
  document.getElementById('pwEye').textContent = '👁';
  document.getElementById('fPassword').type = 'password';
  showView('formView');
}
function updateGroupSelect() {
  const d = getData();
  const sel = document.getElementById('fGroup');
  sel.innerHTML = '<option value="">未分组</option>' + d.groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  if(editingId) {
    const item = d.items.find(i => i.id === editingId);
    if(item) sel.value = item.group || '';
  }
}

function saveItem() {
  const name = document.getElementById('fName').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const account = document.getElementById('fAccount').value.trim();
  const password = document.getElementById('fPassword').value.trim();
  const group = document.getElementById('fGroup').value;
  if(!name || !account || !password) { showToast('请填写名称、账户和密码'); return; }
  const d = getData();
  if(editingId) {
    const idx = d.items.findIndex(i => i.id === editingId);
    if(idx >= 0) { d.items[idx] = {...d.items[idx], name, url, account, password, group}; }
  } else {
    d.items.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, url, account, password, group, created: Date.now()});
  }
  setData(d);
  showToast(editingId ? '已更新' : '已添加', 'success');
  editingId = null;
  showView('mainView');
}

function togglePw() {
  const f = document.getElementById('fPassword');
  const b = document.getElementById('pwEye');
  if(f.type === 'password') { f.type = 'text'; b.textContent = '🙈'; }
  else { f.type = 'password'; b.textContent = '👁'; }
}

function copyToClipboard(text, btnEl) {
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制到剪贴板', 'success');
      if(btnEl) { btnEl.classList.add('copied'); setTimeout(() => btnEl.classList.remove('copied'), 1500); }
    }).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制', 'success'); }
  catch(e) { showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
function copyField(id) {
  const v = document.getElementById(id).value;
  if(!v) { showToast('内容为空'); return; }
  copyToClipboard(v);
}

function viewItem(id) {
  currentDetailId = id;
  const item = getData().items.find(i => i.id === id);
  if(!item) return;
  currentDetailItem = item;
  const rows = [
    {label:'名称', value:item.name, copy:item.name},
    {label:'网址', value:item.url || '未填写', copy:item.url},
    {label:'账户', value:item.account, copy:item.account},
    {label:'密码', value:item.password, copy:item.password},
    {label:'分组', value:item.group || '未分组'},
  ];
  document.getElementById('detailCard').innerHTML = rows.map((r, idx) =>
    `<div class="detail-row"><span class="detail-label">${r.label}</span><span class="detail-value">${esc(r.value)}</span>${r.copy ? `<button class="detail-copy" id="dcopy${idx}" onclick="copyDetailRow(${idx})">📋</button>` : ''}</div>`
  ).join('');
  showView('detailView');
}
function copyDetailRow(idx) {
  const item = currentDetailItem;
  if(!item) return;
  const map = [item.name, item.url, item.account, item.password];
  const val = map[idx];
  if(!val) { showToast('内容为空'); return; }
  const btn = document.getElementById('dcopy' + idx);
  copyToClipboard(val, btn);
}
function editCurrentItem() { openForm(currentDetailId); }
function deleteCurrentItem() {
  openModal('确认删除', '删除后无法恢复，确定要删除吗？', () => {
    const d = getData();
    d.items = d.items.filter(i => i.id !== currentDetailId);
    setData(d);
    showToast('已删除');
    showView('mainView');
  });
}

function renderGroups() {
  const d = getData();
  if(!d.groups.length) {
    document.getElementById('groupList').innerHTML = '<div class="empty-state"><div class="icon">📁</div><p>还没有分组<br>点击上方按钮创建</p></div>';
    return;
  }
  document.getElementById('groupList').innerHTML = d.groups.map(g => {
    const cnt = d.items.filter(i => i.group === g).length;
    return `<div class="group-item"><span class="group-name">${esc(g)}</span><span class="group-count">${cnt} 条</span><button class="group-edit" onclick="editGroup('${esc(g)}')">✏️</button><button class="group-edit" onclick="deleteGroup('${esc(g)}')" style="color:var(--danger)">🗑</button></div>`;
  }).join('');
}
function addGroup() {
  const name = prompt('输入分组名称');
  if(!name || !name.trim()) return;
  const d = getData();
  if(d.groups.includes(name.trim())) { showToast('分组已存在'); return; }
  d.groups.push(name.trim());
  setData(d);
  renderGroups();
  showToast('分组已添加', 'success');
}
function editGroup(old) {
  const newN = prompt('修改分组名称', old);
  if(!newN || !newN.trim() || newN.trim() === old) return;
  const d = getData();
  const idx = d.groups.indexOf(old);
  if(idx >= 0) d.groups[idx] = newN.trim();
  d.items.forEach(i => { if(i.group === old) i.group = newN.trim(); });
  setData(d);
  renderGroups();
  showToast('分组已更新', 'success');
}
function deleteGroup(name) {
  openModal('删除分组', `删除分组「${name}」后，该分组下的密码将变为「未分组」`, () => {
    const d = getData();
    d.groups = d.groups.filter(g => g !== name);
    d.items.forEach(i => { if(i.group === name) i.group = ''; });
    setData(d);
    renderGroups();
    showToast('分组已删除');
  });
}

function renderSyncView() {
  const cfg = getSyncConfig();
  document.getElementById('syncToken').value = cfg.token || '';
  document.getElementById('autoSyncSwitch').checked = cfg.autoSync;
  updateToggleVisual(cfg.autoSync);
  const st = document.getElementById('syncStatus');
  if(!cfg.token) {
    st.className = 'sync-status idle'; st.textContent = '未配置 Token';
  } else if(cfg.gistId) {
    st.className = 'sync-status ok'; st.textContent = cfg.autoSync ? '自动同步已开启 · Gist: ' + cfg.gistId.substring(0,8) + '...' : '已配置 · Gist ID: ' + cfg.gistId.substring(0,8) + '...';
  } else {
    st.className = 'sync-status idle'; st.textContent = 'Token 已配置 · 未创建 Gist';
  }
}
function updateSyncIndicator() {
  const cfg = getSyncConfig();
  const ind = document.getElementById('syncInd');
  if(cfg.token && cfg.autoSync) { ind.classList.add('synced'); ind.textContent = '✅'; }
  else if(cfg.token) { ind.classList.add('synced'); ind.textContent = '☁️'; }
  else { ind.classList.remove('synced'); ind.textContent = '☁️'; }
}
function toggleAutoSync() {
  const checked = document.getElementById('autoSyncSwitch').checked;
  localStorage.setItem('pwvault_sync_auto', checked);
  updateToggleVisual(checked);
  renderSyncView();
  updateSyncIndicator();
  if(checked) showToast('自动同步已开启', 'success');
  else showToast('自动同步已关闭');
}
function updateToggleVisual(on) {
  const dot = document.getElementById('autoSyncDot');
  const track = dot.previousElementSibling;
  if(on) { dot.style.left = '25px'; dot.style.background = 'var(--success)'; track.style.background = 'var(--accent)'; }
  else { dot.style.left = '3px'; dot.style.background = 'var(--text2)'; track.style.background = 'var(--surface2)'; }
}

function saveSyncConfig() {
  const token = document.getElementById('syncToken').value.trim();
  if(!token) { showToast('请输入 Token'); return; }
  localStorage.setItem('pwvault_sync_token', token);
  renderSyncView();
  updateSyncIndicator();
  showToast('配置已保存', 'success');
}

async function doSyncUpload(silent) {
  const cfg = getSyncConfig();
  if(!cfg.token) { if(!silent) { showToast('请先配置 Token'); showView('syncView'); } return; }
  const data = getData();
  const plaintext = JSON.stringify(data);
  const encrypted = aesEncrypt(plaintext, MASTER_PIN);

  const body = {
    description: GIST_DESC,
    public: false,
    files: {}
  };
  body.files[GIST_FILENAME] = { content: encrypted };

  try {
    let res;
    if(cfg.gistId) {
      res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
        method: 'PATCH',
        headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify(body)
      });
    } else {
      res = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify(body)
      });
    }
    if(!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'HTTP ' + res.status);
    }
    const gist = await res.json();
    if(!cfg.gistId) {
      setSyncConfig(cfg.token, gist.id);
    }
    renderSyncView();
    updateSyncIndicator();
    if(!silent) showToast('上传成功', 'success');
    else updateSyncBadge('✓');
  } catch(e) {
    if(!silent) showToast('上传失败: ' + e.message);
    else updateSyncBadge('!');
  }
}

async function doSyncDownload(silent) {
  const cfg = getSyncConfig();
  if(!cfg.token || !cfg.gistId) { if(!silent && cfg.token) showToast('请先上传一次以创建 Gist'); return; }

  try {
    const res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
      headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const gist = await res.json();
    const file = gist.files[GIST_FILENAME];
    if(!file || !file.content) return;

    const decrypted = aesDecrypt(file.content, MASTER_PIN);
    if(!decrypted) return;
    const data = JSON.parse(decrypted);
    const localData = getData();
    if(data.items.length >= localData.items.length) {
      localStorage.setItem('pwvault_data', JSON.stringify(data));
      if(silent && data.items.length > localData.items.length) showToast('已从云端同步 ' + data.items.length + ' 条记录', 'success');
      else if(!silent) showToast('下载成功 · 已更新 ' + data.items.length + ' 条记录', 'success');
    } else if(!silent) {
      openModal('数据冲突', `云端有 ${data.items.length} 条，本地有 ${localData.items.length} 条。要用云端数据覆盖本地吗？`, () => {
        setData(data);
        showToast('已用云端数据覆盖本地', 'success');
        showView('mainView');
      });
    }
  } catch(e) {
    if(!silent) showToast('下载失败: ' + e.message);
  }
}

function updateSyncBadge(status) {
  const ind = document.getElementById('syncInd');
  if(!ind) return;
  ind.textContent = status === '✓' ? '✅' : status === '!' ? '⚠️' : '☁️';
  setTimeout(() => { ind.textContent = '☁️'; }, 3000);
}

function syncUpload() { doSyncUpload(false); }
function syncDownload() { doSyncDownload(false); }

document.addEventListener('DOMContentLoaded', () => { showView('lockView'); });
</script>
